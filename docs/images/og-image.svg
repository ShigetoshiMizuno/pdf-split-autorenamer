<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'Noto Sans JP','Inter',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- ロゴ + プロダクト名 -->
  <g transform="translate(60, 70)">
    <rect width="48" height="48" rx="10" fill="url(#accent)"/>
    <text x="24" y="34" text-anchor="middle" font-size="28" font-weight="800" fill="#0f172a">P</text>
    <text x="62" y="34" font-size="22" font-weight="700" fill="#f8fafc">pdf-split-autorenamer</text>
    <text x="62" y="56" font-size="13" fill="#94a3b8">for Office &amp; Back-office Teams</text>
  </g>

  <!-- バッジ群 -->
  <g transform="translate(60, 165)">
    <g>
      <rect width="100" height="26" rx="13" fill="#10b98122" stroke="#10b98155"/>
      <text x="50" y="18" text-anchor="middle" font-size="12" font-weight="600" fill="#6ee7b7">ローカル動作</text>
    </g>
    <g transform="translate(110, 0)">
      <rect width="110" height="26" rx="13" fill="#10b98122" stroke="#10b98155"/>
      <text x="55" y="18" text-anchor="middle" font-size="12" font-weight="600" fill="#6ee7b7">社外送信なし</text>
    </g>
    <g transform="translate(230, 0)">
      <rect width="100" height="26" rx="13" fill="#ffffff15" stroke="#ffffff30"/>
      <text x="50" y="18" text-anchor="middle" font-size="12" font-weight="600" fill="#cbd5e1">MIT OSS</text>
    </g>
  </g>

  <!-- メインキャッチ（2行） -->
  <text x="60" y="280" font-size="56" font-weight="800" fill="#f8fafc">まとめてスキャンしたPDFを、</text>
  <text x="60" y="346" font-size="56" font-weight="800" fill="url(#accent)">自動で仕分け＆命名。</text>

  <!-- サブテキスト -->
  <text x="60" y="396" font-size="20" fill="#cbd5e1">複合機・ScanSnapで一気に取り込んだ書類を、</text>
  <text x="60" y="424" font-size="20" fill="#cbd5e1">『YYYY-MM-DD_書類タイプ.pdf』に整理。作業 5分。</text>

  <!-- 右側: ヒーローイラスト風 (簡易ファイル束) -->
  <g transform="translate(770, 220)" filter="url(#shadow)">
    <!-- 紙束（Before） -->
    <g transform="translate(0, 30)" opacity="0.85">
      <rect x="-5" y="-3" width="120" height="160" rx="4" fill="#fff" transform="rotate(-7 55 80)"/>
      <rect x="3" y="2" width="120" height="160" rx="4" fill="#fff" transform="rotate(-3 55 80)"/>
      <rect x="0" y="0" width="120" height="160" rx="4" fill="#fff"/>
      <line x1="14" y1="30" x2="106" y2="30" stroke="#94a3b8" stroke-width="2"/>
      <line x1="14" y1="50" x2="106" y2="50" stroke="#cbd5e1"/>
      <line x1="14" y1="70" x2="90" y2="70" stroke="#cbd5e1"/>
      <line x1="14" y1="90" x2="100" y2="90" stroke="#cbd5e1"/>
      <line x1="14" y1="110" x2="80" y2="110" stroke="#cbd5e1"/>
      <line x1="14" y1="130" x2="100" y2="130" stroke="#cbd5e1"/>
    </g>

    <!-- 矢印 -->
    <g transform="translate(150, 100)">
      <path d="M0 10 L40 10 L40 0 L60 20 L40 40 L40 30 L0 30 Z" fill="url(#accent)"/>
    </g>

    <!-- 整理後（After）: 整列したラベル付きファイル -->
    <g transform="translate(240, 0)">
      <g>
        <rect width="160" height="32" rx="4" fill="#fff" stroke="#10b981" stroke-width="2"/>
        <rect x="6" y="6" width="20" height="20" fill="#10b98133"/>
        <text x="32" y="22" font-size="12" font-weight="600" fill="#0f172a">2026-04-01_請求書</text>
      </g>
      <g transform="translate(0, 42)">
        <rect width="160" height="32" rx="4" fill="#fff" stroke="#10b981" stroke-width="2"/>
        <rect x="6" y="6" width="20" height="20" fill="#10b98133"/>
        <text x="32" y="22" font-size="12" font-weight="600" fill="#0f172a">2026-04-08_見積書</text>
      </g>
      <g transform="translate(0, 84)">
        <rect width="160" height="32" rx="4" fill="#fff" stroke="#10b981" stroke-width="2"/>
        <rect x="6" y="6" width="20" height="20" fill="#10b98133"/>
        <text x="32" y="22" font-size="12" font-weight="600" fill="#0f172a">2026-04-15_議事録</text>
      </g>
      <g transform="translate(0, 126)">
        <rect width="160" height="32" rx="4" fill="#fff" stroke="#10b981" stroke-width="2"/>
        <rect x="6" y="6" width="20" height="20" fill="#10b98133"/>
        <text x="32" y="22" font-size="12" font-weight="600" fill="#0f172a">2026-04-25_発注書</text>
      </g>
      <g transform="translate(0, 168)">
        <rect width="160" height="32" rx="4" fill="#fff" stroke="#10b981" stroke-width="2"/>
        <rect x="6" y="6" width="20" height="20" fill="#10b98133"/>
        <text x="32" y="22" font-size="12" font-weight="600" fill="#0f172a">2026-05-01_契約書</text>
      </g>
    </g>
  </g>

  <!-- フッター URL -->
  <text x="60" y="585" font-size="16" fill="#94a3b8">github.com/ShigetoshiMizuno/pdf-split-autorenamer</text>
  <text x="1140" y="585" text-anchor="end" font-size="14" font-weight="600" fill="#22d3ee">無料・OSS・3 Step UI</text>
</svg>
