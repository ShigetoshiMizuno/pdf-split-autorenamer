<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">
  <defs>
    <linearGradient id="bgL" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fef3f2"/>
      <stop offset="1" stop-color="#fee4e2"/>
    </linearGradient>
    <linearGradient id="bgR" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 左パネル: BEFORE -->
  <rect x="20" y="20" width="540" height="480" rx="16" fill="url(#bgL)" stroke="#fda29b" stroke-width="2"/>
  <text x="50" y="65" font-size="22" font-weight="700" fill="#b42318">BEFORE</text>
  <text x="50" y="92" font-size="14" fill="#7a271a">複合機からまとめてスキャンした PDF が 1 つ。<tspan x="50" dy="20">中身は混在、ファイル名もバラバラ。</tspan></text>

  <!-- フォルダアイコン -->
  <g transform="translate(80, 170)">
    <rect x="0" y="0" width="80" height="60" rx="6" fill="#fdb022" stroke="#dc6803" stroke-width="2"/>
    <rect x="0" y="-8" width="36" height="14" rx="3" fill="#fdb022" stroke="#dc6803" stroke-width="2"/>
    <text x="120" y="20" font-size="14" fill="#525252">スキャン_2026年4月分.pdf</text>
    <text x="120" y="40" font-size="11" fill="#a3a3a3">10 ページ・複数書類が混在</text>
    <text x="120" y="55" font-size="10" fill="#a3a3a3">作成日: 2026-04-30 16:42</text>
  </g>

  <!-- ファイルアイコン中身プレビュー -->
  <g transform="translate(80, 270)" filter="url(#shadow)">
    <rect x="0" y="0" width="380" height="180" rx="8" fill="#fff" stroke="#fecdca" stroke-width="1.5"/>
    <text x="20" y="32" font-size="12" font-weight="600" fill="#475467">中身（ばらばら）:</text>
    <text x="20" y="56" font-size="11" fill="#475467">• p.1 請求書 / 山田工業様</text>
    <text x="20" y="76" font-size="11" fill="#475467">• p.2 見積書 / 鈴木建設様</text>
    <text x="20" y="96" font-size="11" fill="#475467">• p.3-4 営業部議事録</text>
    <text x="20" y="116" font-size="11" fill="#475467">• p.5 稟議書 / 複合機リプレイス</text>
    <text x="20" y="136" font-size="11" fill="#475467">• p.6 出張報告 / 大阪</text>
    <text x="20" y="156" font-size="11" fill="#475467">• p.7-10 ほか3書類…</text>
    <text x="220" y="170" font-size="10" fill="#b42318" font-style="italic">→ 検索もできない</text>
  </g>

  <text x="290" y="490" text-anchor="middle" font-size="13" font-weight="600" fill="#b42318">手作業で仕分け＆改名 = 月◯時間</text>

  <!-- 矢印 -->
  <g transform="translate(580, 250)">
    <path d="M0 10 L40 10 L40 0 L60 20 L40 40 L40 30 L0 30 Z" fill="#0e7490" opacity="0.85"/>
    <text x="-5" y="60" font-size="11" fill="#0e7490" text-anchor="middle">psar</text>
    <text x="-5" y="74" font-size="11" fill="#0e7490" text-anchor="middle">3 step</text>
  </g>

  <!-- 右パネル: AFTER -->
  <rect x="660" y="20" width="520" height="480" rx="16" fill="url(#bgR)" stroke="#6ce9a6" stroke-width="2"/>
  <text x="690" y="65" font-size="22" font-weight="700" fill="#067647">AFTER</text>
  <text x="690" y="92" font-size="14" fill="#054f31">書類ごとに分割され、命名規則も統一。<tspan x="690" dy="20">日付順に並び、検索もすぐ。</tspan></text>

  <g transform="translate(700, 160)">
    <g>
      <rect x="0" y="0" width="22" height="28" rx="2" fill="#fff" stroke="#067647" stroke-width="1.5"/>
      <text x="32" y="20" font-size="12" fill="#054f31">2026-04-01_請求書.pdf</text>
    </g>
    <g transform="translate(0, 36)">
      <rect x="0" y="0" width="22" height="28" rx="2" fill="#fff" stroke="#067647" stroke-width="1.5"/>
      <text x="32" y="20" font-size="12" fill="#054f31">2026-04-08_見積書.pdf</text>
    </g>
    <g transform="translate(0, 72)">
      <rect x="0" y="0" width="22" height="28" rx="2" fill="#fff" stroke="#067647" stroke-width="1.5"/>
      <text x="32" y="20" font-size="12" fill="#054f31">2026-04-15_営業部定例議事録.pdf</text>
    </g>
    <g transform="translate(0, 108)">
      <rect x="0" y="0" width="22" height="28" rx="2" fill="#fff" stroke="#067647" stroke-width="1.5"/>
      <text x="32" y="20" font-size="12" fill="#054f31">2026-04-20_稟議書_複合機リプレイス.pdf</text>
    </g>
    <g transform="translate(0, 144)">
      <rect x="0" y="0" width="22" height="28" rx="2" fill="#fff" stroke="#067647" stroke-width="1.5"/>
      <text x="32" y="20" font-size="12" fill="#054f31">2026-04-22_出張報告書_大阪.pdf</text>
    </g>
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="22" height="28" rx="2" fill="#fff" stroke="#067647" stroke-width="1.5"/>
      <text x="32" y="20" font-size="12" fill="#054f31">2026-04-25_発注書.pdf</text>
    </g>
    <g transform="translate(0, 216)">
      <rect x="0" y="0" width="22" height="28" rx="2" fill="#fff" stroke="#067647" stroke-width="1.5"/>
      <text x="32" y="20" font-size="12" fill="#054f31">2026-04-28_領収書.pdf</text>
    </g>
    <g transform="translate(0, 252)">
      <rect x="0" y="0" width="22" height="28" rx="2" fill="#fff" stroke="#067647" stroke-width="1.5"/>
      <text x="32" y="20" font-size="12" fill="#054f31">2026-05-01_業務委託契約書.pdf</text>
    </g>
  </g>

  <text x="920" y="490" text-anchor="middle" font-size="13" font-weight="600" fill="#067647">作業 5 分・あとは確認するだけ</text>
</svg>
