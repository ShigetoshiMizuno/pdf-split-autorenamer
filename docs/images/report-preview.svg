<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="'Segoe UI','Yu Gothic UI','Noto Sans JP',sans-serif">
  <defs>
    <filter id="ds" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- ブラウザ枠 -->
  <g filter="url(#ds)">
    <rect x="20" y="20" width="1060" height="680" rx="10" fill="#fafafa" stroke="#ddd"/>
    <rect x="20" y="20" width="1060" height="46" rx="10" fill="#1e293b"/>
    <rect x="20" y="40" width="1060" height="26" fill="#1e293b"/>
    <circle cx="42" cy="43" r="6" fill="#ef4444"/>
    <circle cx="60" cy="43" r="6" fill="#f59e0b"/>
    <circle cx="78" cy="43" r="6" fill="#10b981"/>
    <rect x="120" y="32" width="900" height="22" rx="11" fill="#475569"/>
    <text x="135" y="48" font-size="12" fill="#cbd5e1">file:///.../scan_2026_04/.psar/report.html</text>
  </g>

  <!-- 実物のヘッダ (sticky) -->
  <rect x="20" y="66" width="1060" height="44" fill="#ffffff" stroke="#dddddd"/>
  <text x="36" y="93" font-size="14" font-weight="700" fill="#222">PDF 分割レビュー</text>
  <text x="170" y="94" font-size="12" fill="#666">ページ 10 / グループ 8 / 境界 7</text>
  <rect x="800" y="76" width="140" height="24" fill="#ffffff" stroke="#888888" rx="2"/>
  <text x="870" y="93" text-anchor="middle" font-size="12" fill="#222">groups.json を保存</text>
  <rect x="950" y="76" width="110" height="24" fill="#ffffff" stroke="#888888" rx="2"/>
  <text x="1005" y="93" text-anchor="middle" font-size="12" fill="#222">初期境界に戻す</text>

  <!-- main コンテナ (max-w 1100, padding 16) -->
  <g transform="translate(40, 122)">
    <!-- pdf-title -->
    <text x="0" y="14" font-size="13" fill="#666">sample_office_scan.pdf</text>
    <line x1="0" y1="22" x2="1020" y2="22" stroke="#dddddd"/>

    <!-- ROW 1: p.1 first-of-group (赤い上罫線・黄色背景) -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="1020" height="118" fill="#fff8e8" stroke="#dddddd"/>
      <rect x="0" y="0" width="1020" height="3" fill="#d33"/>
      <!-- thumb 220px 風の縮小サムネ -->
      <g transform="translate(8, 8)">
        <rect width="80" height="100" fill="#ffffff" stroke="#bbbbbb"/>
        <text x="40" y="30" text-anchor="middle" font-size="9" fill="#888">[請求書]</text>
        <text x="40" y="48" text-anchor="middle" font-size="8" fill="#aaa">サムネ</text>
        <text x="40" y="62" text-anchor="middle" font-size="8" fill="#aaa">220×280</text>
      </g>
      <!-- meta -->
      <g transform="translate(100, 14)">
        <text x="0" y="12" font-size="13" font-weight="700" fill="#222">p.1</text>
        <rect x="40" y="0" width="64" height="16" fill="#eef" stroke="#99c" rx="3"/>
        <text x="72" y="12" text-anchor="middle" font-size="11" fill="#338">グループ 1</text>
        <text x="115" y="12" font-size="11" fill="#666">P  595×842</text>
        <text x="0" y="38" font-size="11" fill="#666" font-family="Consolas,monospace">請求書</text>
        <text x="0" y="56" font-size="11" fill="#666" font-family="Consolas,monospace">No. 2026-0401-001</text>
        <text x="0" y="74" font-size="11" fill="#666" font-family="Consolas,monospace">発行日: 2026年4月1日</text>
        <text x="0" y="92" font-size="11" fill="#666" font-family="Consolas,monospace">株式会社 山田工業 御中</text>
        <!-- ファイル名入力 -->
        <text x="500" y="38" font-size="11" fill="#666">出力名:</text>
        <rect x="546" y="26" width="280" height="20" fill="#ffffff" stroke="#99c" rx="3"/>
        <text x="554" y="40" font-size="11" fill="#222">2026-04-01_請求書</text>
        <text x="500" y="62" font-size="10" fill="#06a">→ sample_office_scan_01_2026-04-01_請求書.pdf</text>
        <!-- 操作ボタン: cut active -->
        <rect x="840" y="0" width="50" height="20" fill="#d33" stroke="#d33" rx="3"/>
        <text x="865" y="14" text-anchor="middle" font-size="11" fill="#fff">cut</text>
        <rect x="894" y="0" width="50" height="20" fill="#ffffff" stroke="#dddddd" rx="3"/>
        <text x="919" y="14" text-anchor="middle" font-size="11" fill="#888">join</text>
      </g>
    </g>

    <!-- ROW 2: p.2 first-of-group -->
    <g transform="translate(0, 156)">
      <rect x="0" y="0" width="1020" height="118" fill="#fff8e8" stroke="#dddddd"/>
      <rect x="0" y="0" width="1020" height="3" fill="#d33"/>
      <g transform="translate(8, 8)">
        <rect width="80" height="100" fill="#ffffff" stroke="#bbbbbb"/>
        <text x="40" y="30" text-anchor="middle" font-size="9" fill="#888">[見積書]</text>
        <text x="40" y="48" text-anchor="middle" font-size="8" fill="#aaa">サムネ</text>
      </g>
      <g transform="translate(100, 14)">
        <text x="0" y="12" font-size="13" font-weight="700" fill="#222">p.2</text>
        <rect x="40" y="0" width="64" height="16" fill="#eef" stroke="#99c" rx="3"/>
        <text x="72" y="12" text-anchor="middle" font-size="11" fill="#338">グループ 2</text>
        <text x="115" y="12" font-size="11" fill="#666">P  595×842</text>
        <text x="0" y="38" font-size="11" fill="#666" font-family="Consolas,monospace">御見積書</text>
        <text x="0" y="56" font-size="11" fill="#666" font-family="Consolas,monospace">見積番号: Q-2026-0408</text>
        <text x="0" y="74" font-size="11" fill="#666" font-family="Consolas,monospace">2026年4月8日</text>
        <text x="0" y="92" font-size="11" fill="#666" font-family="Consolas,monospace">鈴木建設株式会社 御中</text>
        <text x="500" y="38" font-size="11" fill="#666">出力名:</text>
        <rect x="546" y="26" width="280" height="20" fill="#ffffff" stroke="#99c" rx="3"/>
        <text x="554" y="40" font-size="11" fill="#222">2026-04-08_見積書</text>
        <text x="500" y="62" font-size="10" fill="#06a">→ sample_office_scan_02_2026-04-08_見積書.pdf</text>
        <rect x="840" y="0" width="50" height="20" fill="#d33" stroke="#d33" rx="3"/>
        <text x="865" y="14" text-anchor="middle" font-size="11" fill="#fff">cut</text>
        <rect x="894" y="0" width="50" height="20" fill="#ffffff" stroke="#dddddd" rx="3"/>
        <text x="919" y="14" text-anchor="middle" font-size="11" fill="#888">join</text>
      </g>
    </g>

    <!-- ROW 3: p.3 first-of-group -->
    <g transform="translate(0, 282)">
      <rect x="0" y="0" width="1020" height="118" fill="#fff8e8" stroke="#dddddd"/>
      <rect x="0" y="0" width="1020" height="3" fill="#d33"/>
      <g transform="translate(8, 8)">
        <rect width="80" height="100" fill="#ffffff" stroke="#bbbbbb"/>
        <text x="40" y="30" text-anchor="middle" font-size="9" fill="#888">[議事録]</text>
        <text x="40" y="48" text-anchor="middle" font-size="8" fill="#aaa">サムネ</text>
      </g>
      <g transform="translate(100, 14)">
        <text x="0" y="12" font-size="13" font-weight="700" fill="#222">p.3</text>
        <rect x="40" y="0" width="64" height="16" fill="#eef" stroke="#99c" rx="3"/>
        <text x="72" y="12" text-anchor="middle" font-size="11" fill="#338">グループ 3</text>
        <text x="115" y="12" font-size="11" fill="#666">P  595×842</text>
        <text x="0" y="38" font-size="11" fill="#666" font-family="Consolas,monospace">営業部 定例会議 議事録</text>
        <text x="0" y="56" font-size="11" fill="#666" font-family="Consolas,monospace">日時: 2026年4月15日（水）10:00〜11:30</text>
        <text x="0" y="74" font-size="11" fill="#666" font-family="Consolas,monospace">場所: 本社 3F 会議室A</text>
        <text x="0" y="92" font-size="11" fill="#666" font-family="Consolas,monospace">出席者: 部長 佐藤、課長 鈴木、田中、伊藤、高橋</text>
        <text x="500" y="38" font-size="11" fill="#666">出力名:</text>
        <rect x="546" y="26" width="280" height="20" fill="#ffffff" stroke="#99c" rx="3"/>
        <text x="554" y="40" font-size="11" fill="#222">2026-04-15_営業部定例議事録</text>
        <text x="500" y="62" font-size="10" fill="#06a">→ sample_office_scan_03_2026-04-15_営業部定例議事録.pdf</text>
        <rect x="840" y="0" width="50" height="20" fill="#d33" stroke="#d33" rx="3"/>
        <text x="865" y="14" text-anchor="middle" font-size="11" fill="#fff">cut</text>
        <rect x="894" y="0" width="50" height="20" fill="#ffffff" stroke="#dddddd" rx="3"/>
        <text x="919" y="14" text-anchor="middle" font-size="11" fill="#888">join</text>
      </g>
    </g>

    <!-- ROW 4: p.4 つなぐ (join active, 通常背景) -->
    <g transform="translate(0, 408)">
      <rect x="0" y="0" width="1020" height="92" fill="#ffffff" stroke="#dddddd"/>
      <g transform="translate(8, 8)">
        <rect width="80" height="76" fill="#ffffff" stroke="#bbbbbb"/>
        <text x="40" y="22" text-anchor="middle" font-size="9" fill="#888">[議事録]</text>
        <text x="40" y="40" text-anchor="middle" font-size="8" fill="#aaa">2/2</text>
      </g>
      <g transform="translate(100, 14)">
        <text x="0" y="12" font-size="13" font-weight="700" fill="#222">p.4</text>
        <rect x="40" y="0" width="64" height="16" fill="#eef" stroke="#99c" rx="3"/>
        <text x="72" y="12" text-anchor="middle" font-size="11" fill="#338">グループ 3</text>
        <text x="115" y="12" font-size="11" fill="#666">P  595×842</text>
        <text x="0" y="38" font-size="11" fill="#666" font-family="Consolas,monospace">営業部 定例会議 議事録（2/2）</text>
        <text x="0" y="56" font-size="11" fill="#666" font-family="Consolas,monospace">4. 決定事項</text>
        <text x="0" y="74" font-size="11" fill="#666" font-family="Consolas,monospace">5. 次回開催 2026年4月22日（水）10:00〜</text>
        <!-- joined: cut 非アクティブ / join アクティブ -->
        <rect x="840" y="0" width="50" height="20" fill="#ffffff" stroke="#dddddd" rx="3"/>
        <text x="865" y="14" text-anchor="middle" font-size="11" fill="#888">cut</text>
        <rect x="894" y="0" width="50" height="20" fill="#cef" stroke="#39c" rx="3"/>
        <text x="919" y="14" text-anchor="middle" font-size="11" fill="#06a">join</text>
      </g>
    </g>

    <!-- ROW 5: 残り省略行 -->
    <g transform="translate(0, 508)">
      <rect x="0" y="0" width="1020" height="64" fill="#ffffff" stroke="#dddddd" stroke-dasharray="4 3"/>
      <text x="510" y="38" text-anchor="middle" font-size="12" fill="#888" font-style="italic">
        … 残り 6 行（稟議書 / 出張報告書 / 発注書 / 領収書 / 業務委託契約書 p.9-10 で 1 グループ） …
      </text>
    </g>
  </g>

  <text x="550" y="690" text-anchor="middle" font-size="11" fill="#666">
    ※ ボタンの<tspan fill="#d33" font-weight="600">赤</tspan>は「ここで切る」、
    <tspan fill="#06a" font-weight="600">青</tspan>は「直前のグループにつなぐ」。
    <tspan fill="#d33" font-weight="600">赤い上罫線＋薄黄背景</tspan>がグループの先頭ページ。
  </text>
</svg>
