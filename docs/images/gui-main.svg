<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="'Segoe UI','Yu Gothic UI','Noto Sans JP',sans-serif">
  <defs>
    <filter id="ds" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- ウィンドウ枠 (Tkinter on Windows / Tk 8.6 — 素朴なグレー) -->
  <g filter="url(#ds)">
    <!-- Windows タイトルバー -->
    <rect x="20" y="20" width="720" height="32" fill="#ffffff" stroke="#a0a0a0"/>
    <text x="36" y="40" font-size="13" fill="#1f1f1f">pdf-split-autorenamer</text>
    <!-- 右上の最小化/最大化/閉じるボタン -->
    <text x="676" y="40" font-size="14" fill="#3f3f3f">─</text>
    <text x="694" y="40" font-size="12" fill="#3f3f3f">▢</text>
    <rect x="710" y="20" width="30" height="32" fill="#e81123"/>
    <text x="725" y="40" text-anchor="middle" font-size="12" fill="#ffffff">×</text>
    <!-- ウィンドウ本体 -->
    <rect x="20" y="52" width="720" height="488" fill="#f0f0f0" stroke="#a0a0a0"/>
  </g>

  <!-- フォルダ選択行 -->
  <text x="34" y="80" font-size="12" fill="#1f1f1f">PDFフォルダ:</text>
  <rect x="120" y="68" width="490" height="20" fill="#ffffff" stroke="#7a7a7a"/>
  <text x="126" y="83" font-size="11" fill="#1f1f1f">L:¥work¥scan_2026_04¥</text>
  <rect x="618" y="66" width="60" height="24" fill="#e1e1e1" stroke="#7a7a7a"/>
  <text x="648" y="82" text-anchor="middle" font-size="12" fill="#1f1f1f">参照…</text>

  <!-- Step 1: LabelFrame -->
  <g>
    <rect x="34" y="110" width="690" height="60" fill="#f0f0f0" stroke="#9c9c9c"/>
    <rect x="48" y="104" width="280" height="12" fill="#f0f0f0"/>
    <text x="52" y="115" font-size="11" fill="#1f1f1f">1. 解析（サムネ・HTMLレポート生成）</text>

    <rect x="48" y="128" width="100" height="28" fill="#e1e1e1" stroke="#7a7a7a"/>
    <text x="98" y="146" text-anchor="middle" font-size="12" fill="#1f1f1f">解析を実行</text>

    <rect x="158" y="128" width="200" height="28" fill="#e1e1e1" stroke="#7a7a7a"/>
    <text x="258" y="146" text-anchor="middle" font-size="12" fill="#1f1f1f">report.html をブラウザで開く</text>

    <text x="376" y="146" font-size="11" fill="#3f3f3f">HTMLで境界・出力名を編集 → groups.json を上書き保存</text>
  </g>

  <!-- Step 2: LabelFrame -->
  <g>
    <rect x="34" y="186" width="690" height="60" fill="#f0f0f0" stroke="#9c9c9c"/>
    <rect x="48" y="180" width="240" height="12" fill="#f0f0f0"/>
    <text x="52" y="191" font-size="11" fill="#1f1f1f">2. 分割（groups.json に従って）</text>

    <rect x="48" y="204" width="80" height="28" fill="#e1e1e1" stroke="#7a7a7a"/>
    <text x="88" y="222" text-anchor="middle" font-size="12" fill="#1f1f1f">dry-run</text>

    <rect x="138" y="204" width="80" height="28" fill="#e1e1e1" stroke="#7a7a7a"/>
    <text x="178" y="222" text-anchor="middle" font-size="12" fill="#1f1f1f">実行</text>

    <rect x="240" y="212" width="13" height="13" fill="#ffffff" stroke="#7a7a7a"/>
    <text x="262" y="223" font-size="11" fill="#1f1f1f">既存ファイルを上書き (--force)</text>
  </g>

  <!-- Step 3: LabelFrame -->
  <g>
    <rect x="34" y="262" width="690" height="100" fill="#f0f0f0" stroke="#9c9c9c"/>
    <rect x="48" y="256" width="240" height="12" fill="#f0f0f0"/>
    <text x="52" y="267" font-size="11" fill="#1f1f1f">3. 自動リネーム（内容ベース）</text>

    <!-- ラジオ -->
    <circle cx="58" cy="290" r="6" fill="#ffffff" stroke="#7a7a7a"/>
    <circle cx="58" cy="290" r="3" fill="#1f1f1f"/>
    <text x="70" y="294" font-size="12" fill="#1f1f1f">分割直後</text>

    <circle cx="148" cy="290" r="6" fill="#ffffff" stroke="#7a7a7a"/>
    <text x="160" y="294" font-size="12" fill="#1f1f1f">日付不明_を再考</text>

    <circle cx="278" cy="290" r="6" fill="#ffffff" stroke="#7a7a7a"/>
    <text x="290" y="294" font-size="12" fill="#1f1f1f">両方</text>

    <rect x="338" y="278" width="80" height="24" fill="#e1e1e1" stroke="#7a7a7a"/>
    <text x="378" y="294" text-anchor="middle" font-size="12" fill="#1f1f1f">dry-run</text>

    <rect x="426" y="278" width="80" height="24" fill="#e1e1e1" stroke="#7a7a7a"/>
    <text x="466" y="294" text-anchor="middle" font-size="12" fill="#1f1f1f">実行</text>

    <!-- 下段: プロファイル -->
    <text x="48" y="332" font-size="12" fill="#1f1f1f">プロファイル:</text>
    <rect x="124" y="320" width="476" height="20" fill="#f4f4f4" stroke="#7a7a7a"/>
    <text x="130" y="335" font-size="11" fill="#3f3f3f">profiles/business.toml</text>
    <rect x="608" y="318" width="50" height="24" fill="#e1e1e1" stroke="#7a7a7a"/>
    <text x="633" y="334" text-anchor="middle" font-size="12" fill="#1f1f1f">参照…</text>
    <rect x="664" y="318" width="50" height="24" fill="#e1e1e1" stroke="#7a7a7a"/>
    <text x="689" y="334" text-anchor="middle" font-size="12" fill="#1f1f1f">クリア</text>
  </g>

  <!-- ログ LabelFrame -->
  <g>
    <rect x="34" y="378" width="690" height="146" fill="#ffffff" stroke="#9c9c9c"/>
    <rect x="48" y="372" width="50" height="12" fill="#f0f0f0"/>
    <text x="52" y="383" font-size="11" fill="#1f1f1f">ログ</text>

    <text x="44" y="398" font-size="11" fill="#1f1f1f" font-family="Consolas,'Courier New',monospace">[INFO] 解析開始: L:¥work¥scan_2026_04¥</text>
    <text x="44" y="416" font-size="11" fill="#1f1f1f" font-family="Consolas,'Courier New',monospace">[INFO]   ページ数: 10  / 初期グループ: 8</text>
    <text x="44" y="434" font-size="11" fill="#1f1f1f" font-family="Consolas,'Courier New',monospace">[INFO] report.html を開きました</text>
    <text x="44" y="452" font-size="11" fill="#1f1f1f" font-family="Consolas,'Courier New',monospace">[INFO] 分割実行: 8 ファイル → 完了</text>
    <text x="44" y="470" font-size="11" fill="#1f1f1f" font-family="Consolas,'Courier New',monospace">[INFO] リネーム: 8 件 / 失敗 0</text>
    <text x="44" y="488" font-size="11" fill="#1f1f1f" font-family="Consolas,'Courier New',monospace">[INFO]   2026-04-01_請求書.pdf, 2026-04-08_見積書.pdf, ...</text>
    <text x="44" y="506" font-size="11" fill="#1f1f1f" font-family="Consolas,'Courier New',monospace">[INFO] 完了 (所要 0:00:08)</text>
  </g>

  <!-- スクロールバー (右端) -->
  <rect x="711" y="378" width="13" height="146" fill="#f0f0f0" stroke="#9c9c9c"/>
  <rect x="713" y="382" width="9" height="36" fill="#cdcdcd"/>
</svg>
