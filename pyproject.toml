[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-split-autorenamer"
version = "0.3.0"
description = "OCR埋め込みPDFをグループ別に分割し、内容ベースで自動リネームするツール (CUI/GUI共用)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Shigetoshi Mizuno" },
]
keywords = ["pdf", "scan", "ocr", "rename", "split", "scansnap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Utilities",
    "Natural Language :: Japanese",
    "Environment :: Console",
    "Environment :: X11 Applications",
]
dependencies = [
    "PyMuPDF>=1.23,<1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
build = ["pyinstaller>=6.0"]
llm = ["anthropic>=0.25", "keyring>=24.0"]
paddle = ["paddleocr>=2.7", "paddlepaddle>=2.6"]
easyocr = ["easyocr>=1.7"]
all = [
    "anthropic>=0.25",
    "keyring>=24.0",
    "easyocr>=1.7",
]

[project.urls]
Homepage = "https://github.com/ShigetoshiMizuno/pdf-split-autorenamer"
Issues = "https://github.com/ShigetoshiMizuno/pdf-split-autorenamer/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
psar = "pdf_split_autorenamer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
